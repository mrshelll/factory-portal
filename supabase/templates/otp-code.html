<!-- ninben: the email with the sign-in code (Supabase Auth > Email Templates). The subject is in otp-code.subject.txt.
     Rules: COR-10 to COR-13 of the factory's manual (the code first, no links, no images). The line «Vale 1 hora.» must match
     «Email OTP expiration» in the panel; change it here if that setting is not 1 hour. -->
<div style="margin: 0; padding: 24px 16px; background-color: #F7F6EF;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #F7F6EF;">
    <p style="margin: 0 0 16px 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: 2px; color: #111111; background-color: #F7F6EF;">{{ .Token }}</p>
    <p style="margin: 0 0 8px 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #111111; background-color: #F7F6EF;">Este es tu código para entrar a ninben. Vale 1 hora.</p>
    <p style="margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #111111; background-color: #F7F6EF;">Si no lo pediste, ignora este correo.</p>
  </div>
</div>
