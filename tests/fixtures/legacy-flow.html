    --on-signal: #111111;
    --soft: #24224A;
    --ok: #6FBF7A;
    --error: #FF8A80;
  }
}
/* ninben:brand:end */
/* ninben:components:start */
/* ninben components: single source (spec 2026-10-21 piezas al nivel del portal §2 O1 y §7). Edit here, then run
   python3 design-system/assets/brand/sync-brand.py --write <template>… to copy it into each piece, and
   node scripts/sync-brand.mjs in the portal to copy it into its brand/. It goes after ninben.css (colours,
   radius, fonts) and holds the scale tokens, the frame and the shared components, with the values of the
   portal's stylesheet. Mobile first; one breakpoint at 672px (the factory grid's first tier). Nothing uses a
   loose value (FUN-35), and nothing here may ask the network for anything: no imports, no external files. */

:root {
  --text-small: 14px;
  --text-body: 16px;
  --text-title: 24px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-between-blocks: var(--space-6);

  --margin-page: 16px;
  /* The frame reaches the widest review width (1440) with the page margin (24) on each side, and centres above it
     (MAR-11). The portal uses this same frame. */
  --frame-page: 1392px;
  --measure-form: 440px;
  --measure-text: 40rem;

  --radius-pill: 999px;
  --target-min: 48px;
  --mark: 4px; /* the accent stripe of a notice */

  /* The frame contract every design system of the factory exposes (design-md-spec, adaptador-claude-design;
     MAR-08, MAR-09, MAR-11, FUN-05, FUN-37): the geometry measure reads these names. They only point at the
     tokens above, which stay the source of truth. */
  --marco-pagina: calc(var(--frame-page) + 2 * var(--margin-page));
  --marco-margen-sm: var(--space-4);
  --marco-margen-pagina: var(--margin-page);
  --medida-formulario: var(--measure-form);
  --espacio-entre-bloques: var(--space-between-blocks);
  --espacio-1: var(--space-1);
  --espacio-2: var(--space-2);
  --espacio-3: var(--space-3);
  --espacio-4: var(--space-4);
  --espacio-5: var(--space-5);
  --espacio-6: var(--space-6);
  --espacio-7: var(--space-7);
}

@media (min-width: 672px) {
  :root { --margin-page: 24px; }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--text-body)/1.5 var(--font-sans);
  overflow-wrap: break-word;
}
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Loose links: the signal means «you can touch this». */
a { color: var(--signal); text-underline-offset: 3px; }

/* ---- frame ------------------------------------------------------------------------------ */

.frame {
  width: 100%;
  max-width: var(--marco-pagina);
  margin-inline: auto;
  padding-inline: var(--margin-page);
}
/* The ninben logo: the 亻 stroke in signal, left of «ninben» in Inter 600, lowercase (brand spec §2.3).
   Tight tracking and line-height 1 keep it apart from the headings. */
.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-body);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.02em;
}
.brand svg { flex: none; }
/* Inside the portal the host brings the frame (MAR-13): a piece's own bar goes away. */
html[data-factory-host="portal"] .bar { display: none; }

/* ---- notices ---------------------------------------------------------------------------- */

/* A notice is a sheet with a stripe: grey for information, ink for a warning, the error colour for an
   error. Never the signal, which means «you can touch this». */
.notice {
  --notice-accent: var(--muted);
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--line);
  border-inline-start: var(--mark) solid var(--notice-accent);
  border-radius: var(--radius);
  background: var(--sheet);
}
.notice--warning { --notice-accent: var(--ink); }
.notice--error { --notice-accent: var(--error); }
.notice p { max-width: var(--measure-text); }
.notice-actions { display: flex; flex-wrap: wrap; column-gap: var(--space-5); }

/* ---- fields ----------------------------------------------------------------------------- */

.field { display: grid; gap: var(--space-2); }
label { font-weight: 600; }
.hint { color: var(--muted); font-size: var(--text-small); }
input, textarea, select {
  width: 100%;
  min-height: var(--target-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--sheet);
  color: var(--ink);
  font: inherit;
  font-size: var(--text-body); /* 16px or more keeps iOS from zooming in */
}
input[aria-invalid="true"], textarea[aria-invalid="true"], select[aria-invalid="true"] {
  border-color: var(--error);
  box-shadow: inset 0 0 0 1px var(--error);
}
.field-error { color: var(--error); font-size: var(--text-small); font-weight: 600; }

/* ---- buttons and actions ---------------------------------------------------------------- */

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--target-min);
  padding: var(--space-2) var(--space-5);
  border: 1px solid transparent;
  border-radius: var(--radius);
  font: inherit;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
}
.button--primary { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
.button--secondary { background: transparent; color: var(--ink); border-color: var(--muted); }

.link-button {
  appearance: none;
  min-height: 44px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--signal);
  font: inherit;
  text-align: start;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.secondary-actions { display: grid; justify-items: start; gap: var(--space-1); }
/* A row of actions: the first one is the primary and goes at the start; the rest follow it. */
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }

/* ---- rows and status -------------------------------------------------------------------- */

.rows { list-style: none; padding: 0; border-top: 1px solid var(--line); }
.row { border-bottom: 1px solid var(--line); }

.status { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-small); white-space: nowrap; }
/* The state is said in words; the dot only repeats it: hollow grey to start, ink while active, ok once done. */
.status-dot { width: 10px; height: 10px; border: 2px solid var(--dot, var(--muted)); border-radius: var(--radius-pill); background: var(--dot-fill, transparent); }
.status--active .status-dot { --dot: var(--ink); --dot-fill: var(--ink); }
.status--done .status-dot { --dot: var(--ok); --dot-fill: var(--ok); }

/* ---- pieces ------------------------------------------------------------------------------ */

/* A button that does not apply at all (while sending) looks off, never like the signal. One that is missing something
   keeps its normal look and, when touched, takes the focus to what is missing (COM-14). */
.button[disabled] { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }

/* What the factory's HTML sheets (the questions, the flow review, the demo sheet) share and the portal does not:
   each one carries <body class="piece">, the portal's index.html does not, so none of this reaches the portal's
   own pages. :where() keeps each selector as light as without the scope, so a sheet's own rules still win. */
:where(.piece) p, :where(.piece) h1, :where(.piece) h2, :where(.piece) h3, :where(.piece) ul, :where(.piece) dl,
:where(.piece) dd { margin: 0; }
:where(.piece) h1 { font-size: var(--text-title); line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; }
:where(.piece) h1:focus { outline: none; } /* the title takes the focus on each new view; it is not a control */
:where(.piece) h2, :where(.piece) h3 { font-size: var(--text-body); line-height: 1.4; font-weight: 600; }
:where(.piece) main p, :where(.piece) main dd, :where(.piece) legend { max-width: var(--measure-text); } /* about 80 characters a line (FUN-12) */
:where(.piece) main { padding-block: var(--space-6) var(--space-7); }
/* The title band: the h1 with what goes right before or after it (a step count, a saved state, a date). */
:where(.piece) .heading { display: grid; gap: var(--space-2); }
/* «Guardado» (EST-08) is not a verdict: its word alone, in the secondary text colour, with no dot and no verdict colour
   (FUN-40), like the portal's own line (.piece-status). */
:where(.piece) .saved-state { color: var(--muted); font-size: var(--text-small); white-space: nowrap; }
/* A sheet opened on its own brings its bar: the brand and which sheet this is, on the frame's edge (the markup,
   <header class="bar"><div class="frame bar-inner">…, is each sheet's). Inside the portal the rule above hides it. */
:where(.piece) .bar { border-bottom: 1px solid var(--line); background: var(--sheet); }
:where(.piece) .bar-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: var(--space-2) var(--space-4); padding-block: var(--space-3); }
:where(.piece) .where { color: var(--muted); font-size: var(--text-small); }
/* A fold (<details class="more">) with a name that says what it holds (FOR-13): a chevron in SVG, in the signal colour
   like every link, that turns when it opens; only the words are underlined, and the whole summary is a 44 px target. */
:where(.piece) .more summary { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 44px; color: var(--signal);
  cursor: pointer; list-style: none; }
:where(.piece) .more summary::-webkit-details-marker { display: none; }
:where(.piece) .more summary span { text-decoration: underline; text-underline-offset: 3px; }
:where(.piece) .more summary svg { flex: none; width: var(--space-4); height: var(--space-4); }
:where(.piece) .more[open] summary svg { transform: rotate(90deg); }
/* Inside the portal the iframe is the portal's frame box: <main> takes the page margin and the frame in it no longer
   pads, so every block, the frame too, starts on the portal brand's left edge (MAR-13). Only a sheet in the portal
   carries data-factory-host. */
html[data-factory-host="portal"] main { padding-inline: var(--margin-page); }
html[data-factory-host="portal"] main > .frame { padding-inline: 0; }
/* ninben:components:end */

.where-page { display: none; } /* the project and the piece, in the page under the title: only on a phone on its own, where the bar keeps the brand alone */
/* On a phone (MAR-14) a piece opened on its own leaves the screen to the content: at rest the frame, down to the end of
   the title, takes a quarter of the screen at most. The bar, the space above the band and the gaps in it are compacted;
   the title keeps its size and no text is ever cut (FUN-14). Inside the portal nothing changes: its bar is hidden. */
@media (max-width: 671.98px) {
  html:not([data-factory-host="portal"]) .bar-inner { padding-block: var(--space-1); gap: 0 var(--space-4); }
  html:not([data-factory-host="portal"]) .bar .where { display: none; }
  html:not([data-factory-host="portal"]) .where-page { display: block; line-height: 1.25; }
  html:not([data-factory-host="portal"]) main { padding-block-start: var(--space-2); }
  html:not([data-factory-host="portal"]) .heading { gap: var(--space-1); }
}

/* The walkthrough's own styles. Everything shared comes from the two blocks above: the scale, the frame, the components
   (with the portal) and what every sheet shares (under .piece: headings, the title band, the bar, the reading measure,
   the frame inside the portal). What follows is only this piece's own: the views under one frame, the side column from
   1056, the list of flows and its index, the progress bars, and the step with its sketch (.device, .screen, .scr-*), its
   marks and its notes. Only tokens: no loose value (FUN-35). */
:root { --phone: 320px; --radius-device: 16px; --round: 50%; --pin: 32px; }
html { -webkit-text-size-adjust: 100%; }
ol, figure { margin: 0; }
ul, ol { list-style: none; padding: 0; }
button { color: inherit; }

/* One frame for every view (MAR-01, MAR-02): the title band, the notices and the body, one block apart (FUN-37). From
   1056 the body takes two thirds and the side column (your progress, or the flows beside a step) the last third, so the
   wide frame is not left half empty (FUN-43); below, the progress goes after the list and the flows beside a step go. */
.view { display: grid; gap: var(--space-between-blocks); }
.heading h1, .row-title, .side-title, .step-title, .activity h2 { overflow-wrap: anywhere; }
.layout { display: grid; gap: var(--space-between-blocks); align-items: start; }
.main-col { display: grid; gap: var(--space-between-blocks); min-width: 0; }
.side { display: grid; gap: var(--space-3); align-content: start; min-width: 0; }
.side--flows { display: none; }
@media (min-width: 1056px) {
  .layout { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .side--flows { display: grid; }
}
.flow-form { display: grid; gap: var(--space-5); min-width: 0; }
.facts { display: flex; flex-wrap: wrap; column-gap: var(--space-2); }
.facts li:not(:last-child)::after { content: "·"; margin-inline-start: var(--space-2); color: var(--muted); } /* the dot never starts a line */
.reviewer { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-2); }
.send, .confirm { display: grid; gap: var(--space-4); }
.returning { display: grid; gap: var(--space-1); }

/* Progress: where I am and whether it was saved (EST-08). Done in grey, the current one in ink, still to come in the line
   colour: green only means approved (FUN-40). */
.progress-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); }
.bars { display: flex; gap: var(--space-1); }
.bars i, .meter { height: var(--space-1); border-radius: var(--radius); background: var(--line); }
.bars i { flex: 1; }
.bars i.done { background: var(--muted); }
.bars i.current, .meter i { background: var(--ink); }
.meter { overflow: hidden; }
.meter i { display: block; height: 100%; }

/* The list of flows, by activity: each flow is a row you touch, its name in the signal colour, under it what it carries
   and, at its end, its state (COM-13). */
.flows { display: grid; gap: var(--space-between-blocks); min-width: 0; }
.activity { display: grid; gap: var(--space-3); scroll-margin-top: var(--fixed-height, var(--space-7)); }
.flow { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); width: 100%; min-height: var(--target-min);
  padding: var(--space-3) 0; border: 0; background: none; font: inherit; text-align: start; cursor: pointer; }
@media (min-width: 672px) { .flow { flex-direction: row; align-items: center; justify-content: space-between; gap: var(--space-4); } }
.row-main { display: grid; gap: var(--space-1); min-width: 0; }
.row-title { color: var(--signal); font-weight: 600; }
.row-meta { color: var(--muted); font-size: var(--text-small); }
@media (hover: hover) { .flow:hover .row-title { text-decoration: underline; text-underline-offset: 3px; } }
/* The same flows beside a step and in what was sent: they only say how each one is, so nothing in them looks touchable. */
.plain-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4);
  padding-block: var(--space-3); }
.side-row--current .side-title { font-weight: 600; }

/* The index of activities (DET-04): only when the page is longer than three screens, fixed on top, folded, on the start
   line, without its own scroll and without cutting a word. */
.index { min-width: 0; background: var(--bg); border-bottom: 1px solid var(--line); }
/* Fixed on top only on its own from 672: on a phone, and inside the portal whose own bar is already fixed, it scrolls
   with the page, so never two bars stack (MAR-14). */
@media (min-width: 672px) { html:not([data-factory-host="portal"]) .index { position: sticky; top: 0; z-index: 2; } }
.index-list { display: grid; padding-block-end: var(--space-2); }
.index details:not([open]) .index-list { display: none; }
.index-list a { display: flex; align-items: center; min-height: 44px; text-underline-offset: 3px; overflow-wrap: anywhere; }

/* A screen that changed and that several flows share: what it says now and what it said before. */
.block-change, .change-lines { display: grid; gap: var(--space-3); }

/* A step: its title and what happens, then the screen and, beside it from 672 (under it below), the notes and what to do.
   The way back goes last, on the start line. */
.step-intro { display: grid; gap: var(--space-2); }
.step { display: grid; gap: var(--space-5); align-items: start; }
@media (min-width: 672px) {
  .step { grid-template-columns: minmax(0, var(--phone)) minmax(0, 1fr); gap: var(--space-6); }
  .step--wide { grid-template-columns: minmax(0, 1fr); }
}
.sketch { display: grid; justify-items: center; min-width: 0; }
@media (min-width: 672px) { .sketch { justify-items: stretch; } }
.step-side { display: grid; gap: var(--space-5); align-content: start; min-width: 0; }
.change-note { font-weight: 600; }

/* The lo-fi screen, drawn from the flows document. */
.device { width: 100%; max-width: var(--phone); border: 1px solid var(--line); border-radius: var(--radius-device); background: var(--bg);
  padding: var(--space-2); }
.device.wide { max-width: none; border-radius: var(--radius); }
.device.bare { border: 0; padding: 0; background: none; } /* sin boceto: un solo recuadro, el de la pantalla (FUN-06) */
.screen { position: relative; overflow: hidden; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  font-size: var(--text-small); line-height: 1.4; }
.screen.pinnable { cursor: crosshair; }
.scr-el { padding: var(--space-2) var(--space-3); border-bottom: 1px dashed var(--line); }
.scr-el:last-child { border-bottom: 0; }
.scr-head { display: flex; justify-content: space-between; gap: var(--space-2); font-weight: 600; background: var(--bg);
  border: 1px solid var(--line); } /* FUN-34: the bar sits on the screen surface, so it needs its own edge */
.scr-head .l, .scr-text, .scr-note, .scr-list .li, .scr-opt .o, .scr-state, .scr-field .lab, .scr-select .lab, .scr-opt .lab { color: var(--muted); }
.scr-field .lab, .scr-select .lab, .scr-opt .lab { font-family: var(--font-mono); }
.scr-field .box, .scr-select .box { display: block; margin-top: var(--space-1); padding: var(--space-1) var(--space-2); border: 1px solid var(--muted);
  border-radius: var(--radius); color: var(--muted); }
.scr-opt .o { display: inline-block; margin: var(--space-1) var(--space-3) 0 0; }
.scr-opt .o::before { content: "○ "; }
.scr-opt .o.sel::before { content: "● "; }
.scr-check::before { content: "☐ "; color: var(--muted); }
.scr-btn .b { display: inline-block; padding: var(--space-1) var(--space-4); border: 1px solid var(--muted); border-radius: var(--radius); }
.scr-btn.primary .b { font-weight: 600; border-width: 2px; }
.scr-list .li::before { content: "• "; }
.scr-state { font-style: italic; }
.scr-note { background: var(--bg); }
.scr-tabs { display: flex; gap: 2px; padding: var(--space-1) var(--space-2); background: var(--bg); }
.scr-tabs .t { flex: 1; padding: 2px; text-align: center; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); }
.scr-side { display: flex; }
.scr-side .nav { flex: 0 0 calc(var(--space-7) * 2); padding: var(--space-2) var(--space-1); border-right: 1px dashed var(--line); background: var(--bg); }
.scr-side .nav .n { padding: var(--space-1); border-radius: var(--radius); color: var(--muted); }
.scr-side .nav .n.on { background: var(--sheet); color: var(--ink); font-weight: 600; }
.scr-side .body { flex: 1; min-width: 0; }
.scr-end { display: flex; justify-content: center; align-items: center; gap: var(--space-2); padding: var(--space-5) var(--space-3); text-align: center; }
.scr-end svg { flex: none; width: var(--space-4); height: var(--space-4); }
.now-label { font-weight: 400; color: var(--muted); }
.schematic { display: grid; gap: var(--space-2); padding: var(--space-4); text-align: center; color: var(--muted); }
.scr-cambio { background: var(--soft); box-shadow: inset var(--space-1) 0 0 var(--signal); }
.scr-cambio .scr-el, .scr-cambio .scr-text, .scr-cambio .l { color: var(--ink); }
.scr-antes { padding: 2px var(--space-3) var(--space-2); font-style: italic; color: var(--ink); }

/* Marks on the screen (DET-13): numbered buttons that lead to their note, 44 × 44 on the phone (FUN-18); nothing needs
   dragging. */
.pin, .pin-ref { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border-radius: var(--round); background: var(--signal);
  color: var(--on-signal); font: 400 var(--text-small)/1 var(--font-mono); cursor: pointer; }
@media (min-width: 672px) { .pin, .pin-ref { width: var(--pin); height: var(--pin); } }
.pin { position: absolute; z-index: 1; transform: translate(-50%, -50%); border: 2px solid var(--sheet); }
.pin-ref { flex: none; border: 0; }
.pin-draft { opacity: .7; cursor: default; }
.pin-pending { opacity: 1; outline: 2px dashed var(--signal); outline-offset: 2px; }

/* A decision: the usual way, and the other ways folded under a name that says what they hold (FOR-13). A way that
   ends empty is grey like the rest: red is only for an error of this page (FUN-40). */
.decision { display: grid; gap: var(--space-3); width: 100%; padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--sheet); }
.decision .l { font-weight: 600; }
.alts { display: grid; gap: var(--space-2); padding-top: var(--space-2); }
.alt { color: var(--muted); }

/* Notes, written in the page (COM-16, COM-18). */
.notes-block { display: grid; gap: var(--space-3); }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--space-1) var(--space-3); padding-block: var(--space-3); }
.note-text { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-kind { color: var(--muted); font-size: var(--text-small); }
.note-actions { grid-column: 2; display: flex; flex-wrap: wrap; column-gap: var(--space-5); }
.note.editing { display: block; }
.note-editor, .note-form { display: grid; gap: var(--space-4); }
.note-form .field, .flow-form .field { max-width: var(--medida-formulario); }
.note-form textarea, .flow-form textarea { resize: vertical; }
.undo-line { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-2); }

/* What was sent. */
.sent-summary { display: grid; gap: var(--space-3); }
.flow-section { display: grid; gap: var(--space-3); }
/* Closed: each flow's notes go under its row as text, each with the step it is about (FUN-09). */

    return `<section class="block-change" aria-labelledby="block-${i}"><h2 id="block-${i}">Cambió una pantalla que comparten ${n} flujo${n>1?"s":""}</h2>
      <p>La pantalla «${esc(b.t)}» aparece en ${n>1?"":"el flujo "}${flujos}. ${n>1?"El resto de esos flujos no cambió.":"El resto de ese flujo no cambió."}</p>
      <ul class="change-lines">${lineas}</ul>${extra?`<p class="hint">${extra}</p>`:""}

      <button type="button" class="link-button" onclick="verBloque(${i})">Revisarlo flujo por flujo</button></div></section>`;
  }).join("");
}
function confirmarBloque(i){
  const r=revDe(), k=bloquesPendientes()[i]; if(!k) return;
  ST.bloques=ST.bloques||{}; ST.bloques[k]=true;
  for(const id of r.bloques[k].flujos){
    const x=r.flujos[id], st=fs(id);
    if(tocado(id) || !x.bloques.every(b=>ST.bloques[b])) continue;
    st.veredicto="ok"; st.estado="ok";
    st.en_bloque={pantallas:x.bloques.map(b=>r.bloques[b].pid), desde_version:x.fuente.version};
  }
  save(); home();
}
function verBloque(i){
  const r=revDe(), k=bloquesPendientes()[i]; if(!k) return;
  const b=r.bloques[k], id=b.flujos[0];
  openFlow(id); const j=F[id].beats.findIndex(x=>x.t==="p" && x.p===b.pid);

/* lo anotado en un flujo (pins en pantallas + notas de paso + nota del flujo), para verlo desde el mapa */
function obsCount(id){
  const st=fs(id);
  const arrs=Object.values(st.pins||{}).filter(Boolean).flat();
  const pins=arrs.filter(p=>p.x!=null).length, notas=arrs.length-pins;
  const flujo=(st.nota||"").trim()?1:0;
  return {pins, notas, flujo, total:pins+notas+flujo};
}
/* todas las notas del recorrido y en cuantos flujos estan */
function notesTally(){ const c=IDS.map(obsCount); return {notes:c.reduce((a,o)=>a+o.total,0), withNotes:c.filter(o=>o.total).length}; }
const esc = (s)=> String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* COM-13, FUN-40: el estado de un flujo, uno solo y con las palabras de quien revisa: aprobado (lo ya aprobado antes
   tambien), con cambios pedidos (con notas: asi viaja en la revision) o sin revisar */
function flowState(id){
  if(heredado(id)) return "approved";
  const st=ST.flujos[id];
  return !st ? "pending" : st.estado==="ok" ? "approved" : st.estado==="revisar" ? "changes" : "pending";
}

/* FOR-10: la primera vez, cuántos flujos y pasos hay y cuánto toma, y nada más (el proyecto lo dicen la barra y, en el
   portal, el título de la pieza). Con lo ya aprobado por quien revisa, la cuenta corta (FUN-41, FUN-44, entradaHistorial):
   cuántos flujos faltan y el tiempo de ese mismo conjunto, sin repetir la tarjeta de la pantalla compartida (salvo si es
   lo único que queda), sin el total ni lo ya aprobado (lo dice la lista); sin eso, la entrada de siempre. */
function introHTML(pend){
  const cuenta=entradaHistorial(pend), steps=stepsLeft(pend);
  return heading("Antes de empezar", cuenta || `<p>Vas a recorrer ${fact(flowsWord(pend.length))}, paso a paso: ${fact(stepsWord(steps))}, ${fact(aboutMinutes(steps))}.</p>`)

/* FOR-09: al volver, lo primero es donde quedaste y cuanto falta, con un solo boton a ese paso; tu avance va despues de
   la lista en el celular (FUN-42) y al lado desde 1056. Donde quedaste se dice entre los cambios si solo se ven los
   cambios (lugarEnCambios). Con historial, la cuenta corta con la logica de la entrada: «Te faltan 4 flujos, unos 2
   minutos.» (los que se recorren y los de la tarjeta, con su tiempo) y la frase de la tarjeta solo si es lo único que
   queda; sin el total ni lo ya aprobado. */
function resumeHTML(t, pend){
  const f=F[t.flow], seguia=t.beat!==null, c=cuentaHistorial(pend), anda=c ? c.revisa : pend, steps=stepsLeft(anda);
  const lugar = seguia ? lugarEnCambios(t.flow, t.beat, t.changesOnly) : null;
  const donde = !seguia ? "" : !lugar ? `Ibas en el ${fact(`paso ${t.beat+1} de ${f.beats.length}`)}. `
    : lugar.uno ? `Ibas en el ${fact("paso que cambió")}. ` : `Ibas en el ${fact(`cambio ${lugar.k} de ${lugar.m}`)}. `;
  const faltan = c ? c.faltan : anda.length, falta = !anda.length ? "" : c ? `Te ${faltan===1?"falta":"faltan"} ${fact(flowsWord(faltan))}, ${fact(c.minutos)}.`
    : `Te ${faltan===1?"falta":"faltan"} ${fact(flowsWord(faltan))}: ${fact(stepsWord(steps))}, ${fact(aboutMinutes(steps))}.`;
  return heading(`${seguia?"Seguías en":"Sigue con"} ${esc(f.tt)}`, `<p>${donde}${falta}${c && !falta ? c.tarjeta : ""}</p>`)
    + noticesHTML() + layout(`<form class="flow-form" onsubmit="return false">${invitacionRevisor()}${nameHTML()}
      ${primary(needsName()?"startReview()":"resume()","Seguir donde quedé")}</form>${tarjetasBloque()}${flowsHTML()}`, progressHTML(false), "side--progress");
}
/* el final: lo recorrido una sola vez en cifras, lo que se hace con la revisión antes de la lista de flujos (A.3) */
function summaryHTML(){
  const total=porRevisar(), {notes, withNotes}=notesTally();
  const states=IDS.map(flowState), a=states.filter(s=>s==="approved").length, c=states.filter(s=>s==="changes").length;
  const datos=[`${a} ${a===1?"aprobado":"aprobados"}`, `${c} con cambios pedidos`, notes ? `${notesWord(notes)} en ${flowsWord(withNotes)}` : "sin notas"];
  const title = !total ? "Nada cambió desde tu última revisión" : total<IDS.length ? "Revisaste lo que cambió"
    : IDS.length===1 ? "Recorriste el flujo" : `Recorriste los ${IDS.length} flujos`;
  const r=revDe(), antes = !total && r ? `<p>Ya ${IDS.length===1?"lo":"los"} aprobaste ${fechas(IDS.map(id=>r.flujos[id].fuente.generado))}. Puedes enviar tu revisión igual: dice que ${IDS.length===1?"sigue aprobado":"siguen aprobados"}.</p>` : "";
  const s=sendParts();
  const dest = ALONE || s.offline ? "" : `<p>Cuando la envíes, le llega a ${esc(RECIPIENT)}.</p>`;
  return heading(title, `${antes}<ul class="facts">${datos.map(t=>`<li data-rol="dato-clave">${t}</li>`).join("")}</ul>`)
    + noticesHTML() + layout(`<form class="flow-form" onsubmit="return false">${nameHTML()}${dest}
      <div class="send" id="sendBox" tabindex="-1">${s.sent}${s.error}${s.hint}${primary(s.onclick, s.label, s.off)}</div></form>${s.download}${flowsHTML()}`,
      progressHTML(true), "side--progress");
}
/* tu avance: la barra, lo revisado (una vez), las notas, enviar antes de terminar (avisa pero no bloquea) y borrar. Con
   lo ya aprobado que no cambió (que la lista muestra «Aprobado»), la cuenta dice que es de lo que hay por revisar (lo
   que cambió y lo nuevo) */
function progressHTML(final){
  const done=doneCount(), total=porRevisar(), {notes, withNotes}=notesTally();
  const deCuantos = !IDS.some(heredado) ? flowsWord(total) : total===1 ? "1 por revisar" : `los ${total} por revisar`;
  const counts = final ? "" : `<p>Revisaste ${done} de ${deCuantos}.${notes ? ` Dejaste ${notesWord(notes)} en ${flowsWord(withNotes)}.` : ""}</p>`;
  return `<h2 id="sideTitle">Tu avance</h2><div class="meter" aria-hidden="true"><i style="width:${total?Math.round(done/total*100):100}%"></i></div>

}
function laterSendHTML(){
  if(!canSend(buildReview())) return "";
  const s=sendParts();
  return `<div class="send" id="sendBox" tabindex="-1">${s.sent}${s.error}${s.hint}<div class="actions"><button type="button" class="button button--secondary" onclick="${s.onclick}"${s.off}>${s.label}</button></div>${s.download}</div>`;
}
/* SAS-04 / COM-17: «Enviando…» y luego el resultado, en el mismo sitio y dentro de la pagina. El error va antes de la
   accion que lo resuelve, con la causa primero (EST-06, FUN-28); abierta sola, la copia es la accion y su aviso de
   seccion informativo (COM-15), encima del boton, dice por donde mandarla. */
function sendParts(){
  const failed = !!ST.submitError && !sending, offline = failed && notConnected(), copy = ALONE || offline, dest = esc(RECIPIENT);
  return {
    offline,
    sent: ST.submittedAt && !failed && !sending ? `<p class="hint">Enviaste tu revisión ${fechaLarga(ST.submittedAt)}. Si cambias algo, vuelve a enviarla.</p>` : "",
    error: !failed ? "" : `<div class="notice notice--error" id="sendError" role="alert" tabindex="-1"><p><strong>No se pudo enviar tu revisión.</strong> ${offline
      ? `Esta página no puede enviarla por sí sola: descarga una copia y mándasela a ${dest} por correo o por mensaje.`
      : "Puede ser la conexión a internet: revísala y vuelve a intentarlo."}</p></div>`,
    hint: copy && !offline ? `<div class="notice"><p>Descarga una copia y mándasela a ${dest} por correo o por mensaje.</p></div>` : "",
    label: copy ? "Descargar una copia" : sending ? "Enviando…" : ST.submitError ? "Reintentar" : "Enviar revisión",
    onclick: copy ? "downloadReview()" : "submitReview()",
    off: sending ? " disabled" : "",
    download: failed && !copy ? `<div class="secondary-actions"><button type="button" class="link-button" onclick="downloadReview()">Descargar una copia</button></div>` : "",
  };
}
/* sin la conexion al portal no hay a donde reintentar; si la conexion aparece despues, vuelve «Reintentar» */
function notConnected(){ return ST.submitError==="not-connected" && typeof globalThis.factorySubmit!=="function"; }
/* COM-16 / COM-18 / COM-09: borrar el avance se confirma en la pagina, con un boton principal y uno secundario */
let resetAsked = false;
function resetHTML(){
  if(!hasProgress()) return "";

  return `<div class="confirm" id="resetAsk" role="group" aria-labelledby="resetAskText" tabindex="-1"><p id="resetAskText">¿Borrar todo lo que revisaste${REVISOR?" como <b>"+esc(REVISOR)+"</b>":""}? No afecta la revisión de otra persona.</p>
    <div class="actions"><button type="button" class="button button--primary" onclick="resetReview(true)">Sí, borrar mi avance</button><button type="button" class="button button--secondary" onclick="resetReview(false)">Cancelar</button></div></div>`;
}
/* SAS-04: pedir, cancelar y ver el resultado pasa en el mismo sitio, sin saltar al principio de la pagina */
function resetReview(confirmed){
  if(confirmed===true){ ST={flujos:{}}; editor=null; undo=null; resetAsked=false; save(true); home(); return; }
  resetAsked = confirmed!==false;
  home(true);
  focusById(resetAsked ? 'resetAsk' : 'resetButton');
}
function screenTitles(x){ const ts=x.bloques.map(k=>{ const pid=revDe().bloques[k].pid; return "«"+esc(P[pid]?P[pid].t:pid)+"»"; });
  return (ts.length>1 ? "las pantallas " : "la pantalla ")+listaY(ts); }
/* una fila de la lista: el flujo es un boton que lo abre; debajo, lo que lleva; al final, su estado */
function flowRow(id){
  const f=F[id], st=ST.flujos[id], x=hist(id), her=heredado(id), cam=conCambios(id), state=flowState(id), o=obsCount(id);
  const cls = her?"her":state==="approved"?"ok":state==="changes"?"rev":(st && st.estado==="en_curso")?"cur":(cam?"cam":"");
  const meta=[];
  if(her) meta.push(`Ya lo aprobaste el ${fechaCorta(x.fuente.generado)} y no cambió`);
  else if(st && st.en_bloque) meta.push("Aprobaste el cambio de su pantalla compartida");
  else if(cam) meta.push(x.estado==="solo_pantalla" ? `Solo cambió ${screenTitles(x)}` : `${x.rehecho?"Se rehízo":"Cambió"} desde que lo aprobaste el ${fechaCorta(x.fuente.generado)}`);
  if(o.total) meta.push(notesWord(o.total));
  else if(state==="pending") meta.push(stepsWord(cam ? (cambiosDe(id).length || f.beats.length) : f.beats.length));
  return `<button class="flow${cls?" "+cls:""}" onclick="openFlow('${id}')"><span class="row-main"><span class="row-title">${esc(f.tt)}</span>${meta.length?`<span class="row-meta">${meta.join(" · ")}</span>`:""}</span>${statusOf(state)}</button>`;
}
/* la lista de flujos, por actividad, con el indice («Ir a un grupo de flujos»: a quien revisa no se le dice «actividad»)
   solo si la pagina es larga (DET-04, ajustarIndice) */
/* la primera letra en mayúscula; un texto vacío o que no es texto queda como está */
function mayuscula(t){ t=String(t==null?"":t); return t ? t.charAt(0).toUpperCase()+t.slice(1) : t; }
function flowsHTML(){
  const index = BACKBONE.length>1 ? `<nav class="index" id="indice" aria-label="Grupos de flujos"><details class="more" id="indexFold"><summary>${CHEVRON}<span>Ir a un grupo de flujos</span></summary>
    <ul class="index-list">${BACKBONE.map(a=>`<li><a href="#act-${a.id}" onclick="closeIndex()">${esc(a.t)}</a></li>`).join("")}</ul></details></nav>` : "";
  return `<div class="flows">${index}${activitiesHTML(id=>`<li class="row">${flowRow(id)}</li>`, "rows")}</div>`;
}
/* DET-03: los grupos de flujos, cada uno en su seccion con su h2, en el orden de la lista; row pinta cada flujo */
function activitiesHTML(row, rowsClass){
  return BACKBONE.map(a=>`<section class="activity" id="act-${a.id}" aria-labelledby="h-${a.id}"><h2 id="h-${a.id}">${esc(a.t)}</h2>
    <ul class="${rowsClass}">${a.flujos.map(row).join("")}</ul></section>`).join("");

function closeIndex(){ const d=document.getElementById('indexFold'); if(d) d.open=false; }
/* fuera de un flujo: ni flujo abierto, ni nota a medias, ni marca del teclado */
function leaveFlow(){ cur=null; editor=null; undo=null; pendingPin=null; announcePin(); }
function home(keepScroll){
  if(CLOSED){ renderClosed(); return; }   // cerrada, lo pida quien lo pida: solo lo enviado
  leaveFlow();
  if(nothingToSend && canSend(buildReview())) nothingToSend=false;
  const pend = pendingIds(), target = pend.length && hasProgress() ? resumeTarget() : null;
  if(!pend.length) paint("summary", summaryHTML());
  else if(target) paint("resume", resumeHTML(target, pend));
  else paint("intro", introHTML(pend));
  ajustarIndice();
  if(!keepScroll) window.scrollTo(0,0);
}
/* DET-04: el indice de actividades solo aparece si la pagina mide mas de tres pantallas; pegado arriba solo desde 672 y
   fuera del portal (MAR-14; abajo de 672 o en el portal baja con la pagina, y --fixed-height queda en los 8 px de siempre), el
   destino de un enlace no debe quedar tapado (scroll-margin-top de .activity lo lee de --fixed-height). Dentro del portal «tres pantallas» son las del dispositivo (screen.availHeight, altoDePantalla). Se recalcula en
   el resize (p.ej. al girar el telefono) y cuando cargan las fuentes, que cambian el alto. */
function altoDePantalla(){
  if(raizEnPortal()){   // el iframe del portal mide lo que la pieza (MAR-14): innerHeight no dice nada, se mide la pantalla del dispositivo
    const sc = typeof screen==="object" && screen ? screen : {};
    for(const h of [sc.availHeight, sc.height]) if(typeof h==="number" && h>0) return h;
  }
  return innerHeight;
}
function raizEnPortal(){ return document.documentElement.getAttribute('data-factory-host')==="portal"; }
function ajustarIndice(){
  const nav = document.getElementById('indice'), raiz = document.documentElement;
  if(!nav || !raiz || !raiz.style || typeof raiz.scrollHeight!=="number" || typeof innerHeight!=="number") return;
  nav.hidden = true;
  const larga = Math.max(raiz.scrollHeight, document.body ? document.body.scrollHeight : 0) > 3*altoDePantalla();
  nav.hidden = !larga;
  const pegado = larga && (typeof getComputedStyle!=="function" || getComputedStyle(nav).position==='sticky'); // solo si el indice queda pegado arriba (MAR-14)
  raiz.style.setProperty('--fixed-height', ((pegado ? nav.offsetHeight||0 : 0)+8)+'px');
}

/* ---------- WALK (recorrer un flujo) ---------- */
let soloCambios = false;   // con historial: la pieza lleva a los pasos cambiados, no a todos
let editor = null;   // la nota que se esta escribiendo: {flow, beat, pinIndex, x, y, text, error}
let undo = null;     // la ultima nota borrada, para «Deshacer»: {flow, beat, index, item}
let pendingPin = null;   // marca que se esta colocando con el teclado: {flow, beat, x, y}
function openFlow(id){ if(!Object.prototype.hasOwnProperty.call(F, id)){ home(); return; }
  cur=id; editor=null; undo=null; pendingPin=null; const st=fs(id); if(st.estado==="pendiente"){st.estado="en_curso";}
  const cs=cambiosDe(id); soloCambios=cs.length>0; bi=soloCambios?cs[0]:0; renderBeat(); }
function verCompleto(){ soloCambios=false; renderBeat(); }
/* NAV-02: la unica salida a la lista; desde el fin del flujo guarda antes el comentario general */
function toFlows(){ if(cur){ keepDraft(); if(viewName==="flow-end") saveFlowNote(); } home(); }
/* lo que la persona ya aprobo de este flujo y lo que cambio desde entonces, dicho con la fecha (FUN-36, FUN-41) */
function avisoHistorial(){
  const x=hist(cur); if(!x) return "";
  const cuando=fechaLarga(x.fuente.generado);
  if(heredado(cur)) return `<div class="notice"><p>Ya lo aprobaste ${cuando} y no cambió. Puedes recorrerlo igual.</p></div>`;
  if(x.estado==="heredado") return "";
  if(x.estado==="solo_pantalla") return `<div class="notice"><p>Desde que lo aprobaste ${cuando} solo cambió ${screenTitles(x)}; el resto sigue igual.</p></div>`;
  if(x.rehecho || x.sin_detalle) return `<div class="notice"><p>Este flujo se rehízo desde que lo aprobaste ${cuando}: recórrelo completo.</p></div>`;
  const NOMBRES={tt:"el título",entrada:"la entrada",exito:"el éxito esperado",realiza:"lo que realiza",persona:"la persona"};
  const campos=Object.entries(x.campos).map(([c,a])=>`<p class="hint">Antes, ${NOMBRES[c]||c} decía: «${esc(Array.isArray(a)?a.join(", "):String(a))}».</p>`).join("");
  const n=Object.keys(x.pasos).length;
  const quitados = x.quitados ? ` Además se ${x.quitados>1?`quitaron ${x.quitados} pasos`:"quitó 1 paso"}.` : "";
  const solo = soloCambios ? ` Te muestro solo ${n>1?"esos":"ese"}.` : "";
  return `<div class="notice"><p>Desde que lo aprobaste ${cuando} ${n===1?"cambió 1 paso":`cambiaron ${n} pasos`}.${quitados}${solo}</p>${campos}
    ${soloCambios?`<div class="notice-actions"><button type="button" class="link-button" onclick="verCompleto()">Ver el flujo completo</button></div>`:""}</div>`;
}
function marcaPaso(){
  const x=hist(cur), paso=x && x.estado==="cambiado" && x.pasos ? x.pasos[String(bi+1)] : null;
  if(!paso) return "";
  if(paso.nuevo) return `<p class="change-note">Paso nuevo desde que lo aprobaste</p>`;
  const a=paso.antes||{};
  if(!Object.keys(a).length) return `<p class="change-note">Cambió la pantalla de este paso</p>`;
  const t=[];
  if(a.n!=null) t.push(`«${esc(a.n)}»`);
  if(a.s!=null) t.push(`«${esc(a.s)}»`);
  if(a.q!=null) t.push(`«${esc(a.q)}»`);
  if(a.r) t.push(a.r.map(r=>`«${esc(r.l)}»: ${esc(r.r)}`).join("<br>"));
  if(a.p) t.push(`era la pantalla «${esc(P[a.p] ? P[a.p].t : a.p)}»`);
  return `<p class="change-note">Este paso cambió desde que lo aprobaste</p>
    <details class="more"><summary>${CHEVRON}<span>Antes decía…</span></summary><p class="hint">${t.join("<br>")}</p></details>`;
}
/* lineas cambiadas de una pantalla, si este paso la trae distinta a como se aprobo */
function marcaPantalla(pid){
  const x=hist(cur), r=revDe(); if(!x || !r) return null;
  let k=null;
  if(x.estado==="solo_pantalla") k=x.bloques.find(b=>r.bloques[b].pid===pid);
  else if(x.estado==="cambiado" && x.pasos && x.pasos[String(bi+1)]) k=x.pasos[String(bi+1)].pantalla;
  return k ? r.bloques[k] : null;
}
function beats(){ return F[cur].beats; }

/* la linea a la vista; la anuncia #saveStatus (announceSave), asi que aqui «Guardado» va oculto al lector. Sin
   almacenamiento lo dice el aviso de la pagina (noticesHTML). FUN-40: «Guardado» no es un veredicto, va solo con su
   palabra, sin el punto ni el color de «Aprobado». */
function saveHTML(){ return shownSave() ? '<span class="saved-state" id="saveState" aria-hidden="true">Guardado</span>' : '<span id="saveState" hidden></span>'; }
/* el primer paso que la pieza muestra de este flujo: desde ahi no hay paso anterior */
function atFirstShown(){ return soloCambios ? !cambiosDe(cur).some(i=>i<bi) : bi===0; }
/* la lista de flujos al lado de un paso (desde 1056 px): solo dice como va cada uno, no se toca */
/* cuenta como «al volver» (cuentaHistorial): con historial, los flujos que faltan (también los de la tarjeta) y su tiempo,
   y la frase de la tarjeta solo si es lo único que queda */
function sideFlowsHTML(){
  const pend=pendingIds(), c=cuentaHistorial(pend), anda=c ? c.revisa : pend, faltan=c ? c.faltan : anda.length;
  const rows=IDS.map(id=>`<li class="row plain-row${id===cur?" side-row--current":""}"${id===cur?' aria-current="step"':""}><span class="side-title">${esc(F[id].tt)}</span>${statusOf(flowState(id))}</li>`).join("");
  const left = anda.length ? `Te ${faltan===1?"falta":"faltan"} ${flowsWord(faltan)}, ${c ? c.minutos : aboutMinutes(stepsLeft(anda))}.`
    : (c && c.tarjeta) || "Ya recorriste todos los flujos.";
  return `<h2 id="sideTitle">Flujos</h2><ul class="rows">${rows}</ul><p class="hint">${left}</p>`;
}
function stepTitle(b){ return b.t==="p" ? esc(P[b.p] ? P[b.p].t : "Pantalla") : b.t==="d" ? esc(b.q) : "Así termina el flujo"; }
function renderBeat(keepScroll){
  if(CLOSED){ renderClosed(); return; }
  const f=F[cur], p=PERSONAS[f.persona], b=beats()[bi], n=beats().length;
  // FOR-09: cada paso que se muestra queda como «donde quedaste»
  ST.position={flow:cur, beat:bi, changesOnly:soloCambios};
  if(editor && (editor.flow!==cur || editor.beat!==bi)) editor=null;
  if(undo && (undo.flow!==cur || undo.beat!==bi)) undo=null;
  if(pendingPin && (pendingPin.flow!==cur || pendingPin.beat!==bi)) pendingPin=null;
  nothingToSend=false;
  save();
  // con solo los cambios a la vista, el paso y sus barras cuentan los cambios (lugarEnCambios), como al volver
  const lugar = soloCambios ? lugarEnCambios(cur, bi, true) : null, cs = lugar ? cambiosDe(cur) : null;
  const bars = (cs || beats().map((_,i)=>i)).map(i=>`<i class="${i<bi?"done":i===bi?"current":""}"></i>`).join("");
  const pasoDe = !lugar ? `Paso ${bi+1} de ${n}` : lugar.uno ? "El paso que cambió" : `Cambio ${lugar.k} de ${lugar.m}`;
  const surf = b.t==="p" && P[b.p] && P[b.p].surf ? P[b.p].surf : p.surf;
  // pantalla, decision o cierre: todos son pasos, y en todos se puede anotar una observación
  const figure = b.t==="p" ? renderScreen(b.p)
    : b.t==="d" ? renderDecision(b)
    : `<figure class="sketch"><div class="device${p.surf==="grande"?" wide":""}"><div class="screen"><div class="scr-el scr-head"><span>${esc(f.tt)}</span></div><div class="scr-el scr-end">${CHECK}<span>${esc(b.s)}</span></div></div></div></figure>`;
  // R9: la frase de la marca del teclado, junto a la pantalla; la anuncia #pinStatus (announcePin)
  const hint = pendingPin ? `<p class="hint" aria-hidden="true">${pinStatusText()}</p>`
    : isPinnable(b) && !editor ? `<p class="hint">Si algo de esta pantalla no te convence, tócalo y escribe por qué.</p>` : "";
  // con una nota abierta, lo unico que se hace es guardarla o cancelarla (una sola accion principal)
  const form = editor ? "" : `<form class="step-form" onsubmit="return false"><div class="actions"><span class="nav-slot" id="footInner"></span></div></form>`;
  const head = heading(esc(f.tt), `<div class="progress-line"><p class="hint">${pasoDe}</p>${saveHTML()}</div>
    <div class="bars" aria-hidden="true">${bars}</div><p class="hint">${esc(p.nombre)} (${esc(p.rol)}) entra por «${esc(f.entrada)}».</p>`);
  const intro = `<div class="step-intro"><h2 class="step-title">${stepTitle(b)}</h2>${marcaPaso()}${b.n?`<p>${esc(b.n)}</p>`:""}${b.s && b.t!=="f"?`<p>${esc(b.s)}</p>`:""}</div>`;
  const nav = `<div class="secondary-actions">${editor || atFirstShown() ? "" : `<button type="button" class="link-button" onclick="prevBeat()">Volver al paso anterior</button>`}<button type="button" class="link-button" id="homeBtn" onclick="toFlows()">Ver todos los flujos</button></div>`;
  paint("step", head + noticesHTML() + layout(`${avisoHistorial()}${intro}
    <div class="step${surf==="grande"?" step--wide":""}">${figure}<div class="step-side">${hint}${notesHTML()}${form}</div></div>${nav}`, sideFlowsHTML(), "side--flows"));
  wireScreenPins();
  renderFoot();
  announcePin();
  if(!keepScroll) window.scrollTo(0,0);
}

function renderScreen(pid){
  const s = P[pid]; if(!s) return "";
  const f=F[cur], surf = s.surf || PERSONAS[f.persona].surf;
  let inner="";
  if(s.el){ _elIdx=0; _marca=marcaPantalla(pid); inner = s.el.map(renderEl).join(""); _marca=null; }
  else { inner = `<div class="schematic"><p>${esc(s.prop||"")}</p><p>Esta pantalla todavía no tiene boceto: se revisa por el flujo.</p></div>`; }
  /* DET-13: cada marca es un boton numerado que lleva a su nota; nada exige arrastrar */
  const arr = fs(cur).pins[bi]||[];
  let pins = arr.map((pn,i)=> pn.x==null ? "" : `<button type="button" class="pin" id="pin-${bi}-${i}" data-content="person" aria-label="Marca ${i+1}: ${esc(pn.note||"")}" onclick="openNoteEditor({beat:${bi},pinIndex:${i}})" style="left:${pn.x}%;top:${pn.y}%">${i+1}</button>`).join("");
  if(editor && editor.x!=null && (editor.pinIndex===null || arr[editor.pinIndex].x==null || arr[editor.pinIndex].x!==editor.x || arr[editor.pinIndex].y!==editor.y)){
    const k = editor.pinIndex===null ? arr.length : editor.pinIndex;
    pins += `<span class="pin pin-draft" aria-hidden="true" style="left:${editor.x}%;top:${editor.y}%">${k+1}</span>`;
  }
  // DET-13, con teclado: la pantalla se enfoca, Enter o Espacio ponen una marca en el centro, las flechas la
  // mueven de 5 en 5, Enter abre su nota y Escape la quita. Lo anuncia #pinStatus (announcePin); la pista junto a la
  // pantalla es la misma frase a la vista.
  if(pendingPin) pins += `<span class="pin pin-draft pin-pending" aria-hidden="true" style="left:${pendingPin.x}%;top:${pendingPin.y}%">${(editor && editor.pinIndex!==null ? editor.pinIndex : arr.length)+1}</span>`;
  const marcable = s.el ? ` tabindex="0" role="group" aria-label="Pantalla ${esc(s.t)}: toca un punto, o pulsa Enter para marcarlo con el teclado"` : "";
  return `<figure class="sketch"><div class="device${surf==="grande"?" wide":""}${s.el?"":" bare"}">
    <div class="screen${s.el?" pinnable":""}" id="screenBox" data-pid="${esc(pid)}"${marcable}>${inner}${pins}</div></div></figure>`;
}
/* R9: una sola region viva (#pinStatus, fuera de la vista que se repinta) anuncia la marca del teclado; solo
   cambia su texto, asi el lector de pantalla lo lee en cada movimiento */
function pinStatusText(){
  return pendingPin ? `Marca en ${pendingPin.x} % a lo ancho y ${pendingPin.y} % a lo alto. Muévela con las flechas; Enter para escribir la nota, Escape para quitarla.` : "";
}
function announcePin(){
  const n=document.getElementById('pinStatus'), t=cur ? pinStatusText() : "";
  if(n && n.textContent!==t) n.textContent=t;
}

/* renderEl numera los elementos en orden de pintado (side antes que su body) para resaltar
   las lineas que cambiaron; el mismo orden que usa historial_recorrido.py */
let _elIdx=0, _marca=null;
function renderEl(e){
  const i=_elIdx++, h=pintarEl(e);
  if(!_marca || !_marca.nuevas.includes(i)) return h;
  const a=_marca.antes[String(i)];
  return `<div class="scr-cambio">${h}${a!=null?`<div class="scr-antes">antes: ${esc(a)}</div>`:""}</div>`;
}
function pintarEl(e){
  switch(e.k){
    case "head": return `<div class="scr-el scr-head"><span>${esc(e.x)}</span><span class="l">${esc(e.l||"")}</span></div>`;
    case "text": return `<div class="scr-el scr-text">${esc(e.x)}</div>`;
    case "field": return `<div class="scr-el scr-field"><div class="lab">${esc(e.lab||"")}</div><span class="box">${esc(e.v||"")}</span></div>`;
    case "select": return `<div class="scr-el scr-select"><div class="lab">${esc(e.lab||"")}</div><span class="box">${esc(e.v||"")}</span></div>`;
    case "opt": return `<div class="scr-el scr-opt"><div class="lab">${esc(e.lab||"")}</div>${e.os.map((o,i)=>`<span class="o ${i===e.sel?"sel":""}">${esc(o)}</span>`).join("")}</div>`;
    case "check": return `<div class="scr-el scr-check">${esc(e.x)}</div>`;
    case "btn": return `<div class="scr-el scr-btn ${e.p?"primary":""}"><span class="b">${esc(e.x)}</span></div>`;
    case "list": return `<div class="scr-el scr-list">${e.li.map(x=>`<div class="li">${esc(x)}</div>`).join("")}</div>`;
    case "state": return `<div class="scr-el scr-state">${esc(e.x)}</div>`;
    case "note": return `<div class="scr-el scr-note">${esc(e.x)}</div>`;
    case "tabs": return `<div class="scr-tabs">${e.li.map(x=>`<span class="t">${esc(x)}</span>`).join("")}</div>`;
    case "side": return `<div class="scr-side"><div class="nav">${e.nav.map((n,i)=>`<div class="n ${i===e.on?"on":""}">${esc(n)}</div>`).join("")}</div><div class="body">${e.body.map(renderEl).join("")}</div></div>`;
    default: return "";
  }
}

/* una decision: el camino de siempre a la vista y los demas plegados; el titulo del paso es la pregunta */
function renderDecision(b){
  const main = b.r.find(x=>x.ok) || b.r[0];
  const alts = b.r.filter(x=>x!==main);
  return `<div class="decision"><p><span class="l">${esc(main.l)}</span>: ${esc(main.r)}</p>
    ${alts.length?`<details class="more"><summary>${CHEVRON}<span>¿Qué pasa si no? (${alts.length === 1 ? "1 camino más" : alts.length+" caminos más"})</span></summary><ul class="alts">${alts.map(a=>`<li class="alt"><span class="l">${esc(a.l)}</span>: ${esc(a.r)}</li>`).join("")}</ul></details>`:""}</div>`;
}

/* ---------- notas por paso, escritas en la pagina (DET-13, COM-16, COM-18) ---------- */
/* una pantalla con boceto se puede marcar en un punto; una decision, el cierre o una pantalla sin boceto
   no tienen imagen que marcar: ahi la nota es del paso (tipo "nota") */
function isPinnable(b){ return !!b && b.t==="p" && !!P[b.p] && !!P[b.p].el; }
/* las notas del paso, cada una enlazada con su marca, «Nota borrada · Deshacer», «Anotar una observación» y el editor
   de una nota nueva */
function notesHTML(){
  const notes=(fs(cur).pins[bi]||[]);
  const items=notes.map((pn,i)=>{
    if(editor && editor.pinIndex===i) return `<li class="row note editing" id="note-${bi}-${i}">${noteEditorHTML()}</li>`;
    const ref = pn.x!=null
      ? `<button type="button" class="pin-ref" onclick="focusPin(${i})" aria-label="Ver la marca ${i+1} en la pantalla">${i+1}</button>`
      : `<span class="note-kind">En el paso</span>`;
    return `<li class="row note" id="note-${bi}-${i}" tabindex="-1">${ref}<span class="note-text" data-content="person">${esc(pn.note||"")}</span>
      <span class="note-actions"><button type="button" class="link-button" onclick="openNoteEditor({beat:${bi},pinIndex:${i}})" aria-label="Editar la nota ${i+1}">Editar</button><button type="button" class="link-button" onclick="deleteNote(${i})" aria-label="Borrar la nota ${i+1}">Borrar</button></span></li>`;
  }).join("");
  const list = notes.length ? `<div class="notes-block"><h3>Tus notas</h3><ol class="rows notes" id="noteList" tabindex="-1">${items}</ol></div>` : "";
  const undone = undo ? `<p class="undo-line" role="status"><span>Nota borrada</span><span aria-hidden="true">·</span><button type="button" class="link-button" onclick="undoDelete()">Deshacer</button></p>` : "";
  const fresh = editor && editor.pinIndex===null ? noteEditorHTML()
    : editor ? "" : `<div class="actions"><button type="button" class="button button--secondary" onclick="openNoteEditor({beat:${bi},pinIndex:null})">Anotar una observación</button></div>`;
  return list + undone + fresh;
}
function noteEditorHTML(){
  const arr=fs(cur).pins[bi]||[], k=editor.pinIndex===null ? arr.length : editor.pinIndex;
  const titulo = editor.x!=null ? `¿Qué observas en el punto ${k+1}?` : "¿Qué observas en este paso?";
  const hint = isPinnable(beats()[bi]) ? (editor.x!=null ? "Toca otro punto de la pantalla para mover la marca." : "Puedes tocar el punto de la pantalla al que se refiere.") : "";
  const err = editor.error ? `<p class="field-error" id="noteTextError" role="alert">Escribe tu observación, o cancela.</p>` : "";
  const describe = [hint?"noteTextHint":"", editor.error?"noteTextError":""].filter(Boolean).join(" ");
  return `<div class="note-editor" id="noteEditor"><form class="note-form" onsubmit="return false"><div class="field"><label for="noteText">${titulo}</label>
    ${hint?`<p class="hint" id="noteTextHint">${hint}</p>`:""}<textarea id="noteText" rows="4" onkeydown="noteKey(event)"${describe?` aria-describedby="${describe}"`:""}${editor.error?' aria-invalid="true"':""}>${esc(editor.text)}</textarea>${err}</div>
    ${primary("saveNote(document.getElementById('noteText').value)","Guardar nota")}</form>
    <div class="secondary-actions"><button type="button" class="link-button" onclick="cancelNote()">Cancelar</button>${editor.pinIndex!==null?`<button type="button" class="link-button" onclick="deleteNote(${editor.pinIndex})">Borrar nota</button>`:""}</div></div>`;
}
function clampPct(v){ return Math.min(100, Math.max(0, Math.round(Number(v)))); }
function openNoteEditor(o){
  if(!cur) return;
  keepDraft();   // abrir otra nota no pierde lo escrito en la que estaba abierta
  o=o||{};
  const n=beats().length;
  if(Number.isInteger(o.beat) && o.beat>=0 && o.beat<n) bi=o.beat;
  const arr=fs(cur).pins[bi]||[];
  const pinIndex = Number.isInteger(o.pinIndex) && arr[o.pinIndex] ? o.pinIndex : null;
  const item = pinIndex===null ? null : arr[pinIndex];
  let x=null, y=null;
  if(isPinnable(beats()[bi]) && Number.isFinite(o.x) && Number.isFinite(o.y)){ x=clampPct(o.x); y=clampPct(o.y); }
  else if(item && item.x!=null){ x=item.x; y=item.y; }
  editor={flow:cur, beat:bi, pinIndex, x, y, text:item ? String(item.note||"") : "", error:false};
  pendingPin=null;   // R9: abrir una nota reemplaza la marca provisional del teclado
  renderBeat(true);
  focusById('noteText');
}
/* lo escrito y aun no guardado (el textarea es la fuente mientras se escribe) */
function draftText(){ const t=document.getElementById('noteText'); return t && typeof t.value==="string" ? t.value : (editor ? editor.text : ""); }
function saveNote(text){
  if(!editor || editor.flow!==cur) return false;
  const nota=String(text==null?"":text).trim();
  if(!nota){ editor.text=String(text==null?"":text); editor.error=true; renderBeat(true); focusById('noteText'); return false; }
  const st=fs(cur), b=editor.beat; if(!st.pins[b]) st.pins[b]=[];
  const arr=st.pins[b], pos=editor.x!=null ? {x:editor.x, y:editor.y, pid:beats()[b].p} : null;
  if(editor.pinIndex!==null && arr[editor.pinIndex]){
    const it=arr[editor.pinIndex]; it.note=nota;
    if(pos){ it.x=pos.x; it.y=pos.y; it.pid=pos.pid; delete it.general; }
  } else arr.push(pos ? {x:pos.x, y:pos.y, note:nota, pid:pos.pid} : {note:nota, general:true});
  editor=null; pendingPin=null; recomputeFlowState(cur); renderBeat(true);
  focusById('noteList');
  return true;
}
function cancelNote(){ editor=null; pendingPin=null; if(cur) renderBeat(true); }
/* COM-16: borrar no pide confirmacion; deja «Nota borrada · Deshacer» en el mismo lugar */
function deleteNote(i){
  // borrar otra nota no pierde lo escrito; la que se borra, si estaba abierta, se va como estaba (y «Deshacer» la trae)
  if(editor && editor.pinIndex!==i) keepDraft();
  const arr=fs(cur).pins[bi]; if(!arr||!arr[i]) return;
  const item=arr.splice(i,1)[0]; if(arr.length===0) delete fs(cur).pins[bi];
  undo={flow:cur, beat:bi, index:i, item}; editor=null; pendingPin=null;
  recomputeFlowState(cur); renderBeat(true);
}
function undoDelete(){
  if(!undo) return;
  const u=undo; undo=null;
  const st=fs(u.flow); if(!st.pins[u.beat]) st.pins[u.beat]=[];
  const arr=st.pins[u.beat]; arr.splice(Math.min(u.index, arr.length), 0, u.item);
  recomputeFlowState(u.flow); save();
  if(cur===u.flow) renderBeat(true);
}
/* una nota a medio escribir no se pierde al moverse de paso */
function keepDraft(){
  if(!editor || editor.flow!==cur) return;
  const t=draftText(); if(t.trim()) saveNote(t); else editor=null;
}
function addNote(){ openNoteEditor({beat:bi, pinIndex:null}); }
function focusPin(i){ focusById('pin-'+bi+'-'+i); }
function noteKey(ev){
  if(ev.key==='Escape') cancelNote();
  else if(ev.key==='Enter' && (ev.metaKey||ev.ctrlKey)) saveNote(draftText());   // Enter suelto = salto de línea
}

function wireScreenPins(){
  const box=document.getElementById('screenBox'); if(!box || !isPinnable(beats()[bi])) return;
  box.addEventListener('click',(ev)=>{
    if(ev.target && ev.target.closest && ev.target.closest('.pin')) return;   // una marca lleva a su nota
    const r=box.getBoundingClientRect();
    const x=clampPct((ev.clientX-r.left)/r.width*100), y=clampPct((ev.clientY-r.top)/r.height*100);
    pendingPin=null;   // R9: tocar la pantalla reemplaza la marca provisional del teclado
    if(editor){ editor.text=draftText(); editor.x=x; editor.y=y; renderBeat(true); focusById('noteText'); }   // mover la marca
    else openNoteEditor({beat:bi, pinIndex:null, x, y});
  });
  box.addEventListener('keydown', (ev)=>{
    if(ev.target!==box) return;   // las teclas sobre una marca son de esa marca
    const k=ev.key, PASO=5, mover={ArrowLeft:[-PASO,0], ArrowRight:[PASO,0], ArrowUp:[0,-PASO], ArrowDown:[0,PASO]};
    // R9: lo escrito en la nota abierta se guarda antes de cada repintado, como al tocar con el raton
    const repaint=(focus)=>{ if(editor) editor.text=draftText(); renderBeat(true); focusById(focus); };
    if(!pendingPin){
      if(k!=="Enter" && k!==" ") return;
      ev.preventDefault();
      const desde = editor && editor.x!=null ? editor : {x:50, y:50};
      pendingPin={flow:cur, beat:bi, x:desde.x, y:desde.y};
      repaint('screenBox'); return;
    }
    if(mover[k]){
      ev.preventDefault();
      pendingPin.x=clampPct(pendingPin.x+mover[k][0]); pendingPin.y=clampPct(pendingPin.y+mover[k][1]);
      repaint('screenBox');
    } else if(k==="Enter" || k===" "){
      ev.preventDefault();
      const {x,y}=pendingPin; pendingPin=null;
      if(editor){ editor.x=x; editor.y=y; repaint('noteText'); }   // mover la marca de la nota abierta
      else openNoteEditor({beat:bi, pinIndex:null, x, y});
    } else if(k==="Escape"){
      ev.preventDefault();
      pendingPin=null; repaint('screenBox');
    }
  });
}
function recomputeFlowState(id){
  const st=fs(id);
  // un flujo ya terminado vuelve a derivar su veredicto si cambian sus notas: una nota nueva lo pasa a revisar.
  // Solo un veredicto que derivo esta plantilla (verdictDerived, no viaja en la revision) vuelve de revisar a ok:
  // un veredicto «revisar» explicito de la plantilla anterior nunca se convierte en una aprobacion que nadie dio.
  if(st.veredicto){
    const v = deriveVerdict(id);
    if(st.verdictDerived) st.veredicto = v;
    else if(v==="revisar" && st.veredicto!=="revisar"){ st.veredicto = v; st.verdictDerived = true; }
    st.estado = st.veredicto==='ok'?'ok':'revisar'; return;
  }
  const hasPins=Object.values(st.pins||{}).some(a=>a&&a.length);
  const hasNote=!!(st.nota||"").trim();
  st.estado = (hasPins||hasNote)?'revisar':'en_curso';
}

/* ---------- la accion principal del paso: seguir, o terminar el flujo ---------- */
function sigCambio(){ return cambiosDe(cur).find(i=>i>bi); }
function renderFoot(){
  const fi=document.getElementById('footInner'); if(!fi) return;   // con una nota abierta no hay hueco: se guarda o se cancela
  if(editor){ fi.innerHTML=""; return; }
  // LES-UXF-008: seguir sin notas es un visto bueno, y el boton lo dice
  if(atLastShown()){
    const endLabel = deriveVerdict(cur)==="ok" ? "Aprobar y terminar el flujo" : "Terminar este flujo";
    fi.innerHTML = `<button type="button" class="button button--primary" data-rol="accion-principal" onclick="finishFlow()">${endLabel}</button>`;
  } else {
    const hasObs = (fs(cur).pins[bi]||[]).length>0;
    const nextLabel = soloCambios ? "Ver el siguiente cambio" : (hasObs ? "Continuar" : "Aprobar y continuar");
    fi.innerHTML = `<button type="button" class="button button--primary" data-rol="accion-principal" onclick="nextBeat()">${nextLabel}</button>`;
  }
}
function nextBeat(){
  keepDraft();
  if(soloCambios){ const j=sigCambio(); if(j!==undefined){ bi=j; renderBeat(); } return; }
  if(bi<beats().length-1){bi++;renderBeat();}
}
function prevBeat(){
  keepDraft();
  if(soloCambios){ const j=cambiosDe(cur).filter(i=>i<bi).pop(); if(j!==undefined){ bi=j; renderBeat(); } else { home(); } return; }
  if(bi>0){bi--;renderBeat();} else { home(); }
}

/* ---------- cierre del flujo ---------- */
/* el ultimo paso que la pieza muestra: el ultimo del flujo, o el ultimo cambio si solo se recorren cambios */
function atLastShown(){ return soloCambios ? sigCambio()===undefined : bi>=beats().length-1; }
function finishFlow(){
  if(CLOSED){ renderClosed(); return; }
  keepDraft();
  const f=F[cur], st=fs(cur);
  // el veredicto se deriva al terminar el ultimo paso mostrado; cerrar antes no aprueba nada
  if(atLastShown()){ st.veredicto=deriveVerdict(cur); st.verdictDerived=true; st.estado = st.veredicto==='ok'?'ok':'revisar'; save(); }
  const sig=sigFlujo(), o=obsCount(cur);
  const notas = o.total ? `Dejaste ${notesWord(o.total)} en este flujo.` : "Sin notas en este flujo.";
  pendingPin=null; nothingToSend=false; announcePin();
  // el nombre del siguiente va en su frase: en el boton, con un nombre largo, la accion ocuparia todo el ancho (MAR-06)
  const siguiente = sig ? "Ir al siguiente flujo" : ALONE ? "Revisar y descargar" : "Revisar y enviar";
  const sigue = sig ? `<p>Sigue «${esc(F[sig].tt)}».</p>` : "";
  paint("flow-end", heading(esc(f.tt), `<div class="progress-line">${statusOf(flowState(cur))}<p class="hint">${notas}</p></div>`)
    + noticesHTML() + layout(`<form class="flow-form" onsubmit="return false">
      <section class="flow-section" aria-labelledby="endGoal"><h2 id="endGoal">Lo que se espera al terminar</h2><p>${esc(mayuscula(f.exito))}.</p></section>
      <section class="flow-section" aria-labelledby="endNext"><h2 id="endNext">Lo que sigue</h2>
      ${sigue}<details class="more"${(st.nota||"").trim()?" open":""}><summary>${CHEVRON}<span>Agregar un comentario general</span></summary>
        <div class="field"><label for="flowNote">Comentario general del flujo (opcional)</label><p class="hint" id="flowNoteHint">Lo que quieras decir del flujo entero: qué falta o qué cambiarías.</p>
          <textarea id="flowNote" rows="4" aria-describedby="flowNoteHint">${esc(st.nota||"")}</textarea></div></details>
      ${primary("saveAndNext()", siguiente)}</section></form>
    <div class="secondary-actions"><button type="button" class="link-button" onclick="renderBeat()">Volver al último paso</button><button type="button" class="link-button" id="homeBtn" onclick="toFlows()">Ver todos los flujos</button></div>`,
      sideFlowsHTML(), "side--flows"));
  focusById('viewTitle');
  window.scrollTo(0,0);
}
/* encadenar: al cerrar un flujo se sigue con el siguiente del recorrido, sin pasar por el mapa */
function sigFlujo(){ const i=IDS.indexOf(cur); if(i<0) return null;
  // lo que falta, en orden del recorrido empezando despues del actual y dando la vuelta (lo hecho desde la lista puede
  // dejar pendientes antes del actual): primero uno que no es de una tarjeta pendiente, luego uno de la tarjeta, y solo
  // si no falta nada el siguiente del recorrido aunque ya este revisado. Lo terminado nunca le gana a lo que falta.
  const pend=pendingIds(), faltan=IDS.slice(i+1).concat(IDS.slice(0,i)).filter(id=>pend.includes(id));
  const resto=IDS.slice(i+1).filter(id=>!heredado(id) && !fs(id).en_bloque);   // salta lo ya aprobado y lo confirmado en bloque
  return faltan.find(id=>!enTarjeta(id)) || faltan[0] || resto[0] || null; }
function saveAndNext(){ saveFlowNote(); const n=sigFlujo(); if(n){ openFlow(n); } else { home(); } }
function saveFlowNote(){ const t=document.getElementById('flowNote'); if(t){ fs(cur).nota=String(t.value||"").trim(); } recomputeFlowState(cur); save(); }

/* ---------- la revision: lo que vuelve a la fabrica (spec §5, mismos campos de siempre) ---------- */
function buildReview(){
  const out = {
    proyecto:"plataforma-fitness-funcional", artefacto:"ux-flows.md", version_revisada:SRC_VERSION,
    revisor:REVISOR, generado:new Date().toISOString(), huella_modelo:HUELLAS.modelo,
    resumen:{flujos_totales:IDS.length, revisados:0, ok:0, con_observacion:0, incompletos:0, heredados:0, en_bloque:0, comentarios:0},
    flujos:[]
  };
  for(const id of IDS){
    if(heredado(id)){
      /* arrastre, no aprobacion: dice de que version y de que revision sale el visto bueno */
      const x=hist(id).fuente;
      out.flujos.push({ id, titulo:F[id].tt, persona:F[id].persona, veredicto:"heredado",
        aprobado_en_version:x.version, aprobado_el:x.generado,
        fuente:{revisor:slugRevisor(REVISOR), version:x.version, generado:x.generado, archivo:x.archivo},
        nota:"", observaciones:[], huella:HUELLAS.flujos[id] });
      out.resumen.heredados++;
      continue;
    }
    const st=ST.flujos[id]; if(!st || st.estado==="pendiente") continue;
    const obs = Object.entries(st.pins||{}).flatMap(([b,arr])=>arr.map(pn=>{
      const o={paso:Number(b)+1, tipo:(pn.x!=null?"pin":"nota"), nota:pn.note};
      if(pn.x!=null){ o.pantalla=pn.pid; o.posicion=pn.x+"%,"+pn.y+"%"; }
      return o;
    }));
    /* sin terminar el flujo no hay `ok`: un flujo abierto y dejado a medias viaja como
       "incompleto" y no cuenta como revisado. Emitirlo como "ok" fabricaba sign-offs que nadie
       dio (LES-UXF-008). El veredicto se calcula UNA vez y el resumen lo reutiliza. */
    const v = st.veredicto || (st.estado==="revisar" ? "revisar" : "incompleto");
    const flujo = { id, titulo:F[id].tt, persona:F[id].persona,
      veredicto: v, nota: st.nota||"", observaciones: obs, huella:HUELLAS.flujos[id] };
    if(v==="ok" && st.en_bloque){ flujo.confirmado_en_bloque = st.en_bloque; out.resumen.en_bloque++; }
    out.flujos.push(flujo);
    out.resumen.comentarios += obs.length;
    if(v==="incompleto"){ out.resumen.incompletos++; continue; }
    out.resumen.revisados++;
    if(v==="ok") out.resumen.ok++; else out.resumen.con_observacion++;
  }
  return out;
}
/* con todo heredado no hay nada que revisar: el archivo registra el arrastre y se puede mandar */
function canSend(out){ return !(out.flujos.length===out.resumen.heredados && porRevisar()>0); }
/* plan B: el mismo archivo de siempre */
function downloadReview(){
  if(CLOSED) return;
  if(!takeName()) return;
  const out = buildReview();
  if(!canSend(out)){ nothingToSend=true; home(true); return; }   // el aviso dice que falta revisar al menos un flujo
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toISOString().slice(0,10);
  a.href=url; a.download=`revision-${out.proyecto}-ux-flows-v${SRC_VERSION}-${slugRevisor(REVISOR)}-${d}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

// Single submit seam (spec 2026-10-19 rediseño §3.3). The portal connection provides globalThis.factorySubmit.
function submitResponse(payload) // -> Promise<{ok:true} | {ok:false, error:string}>
{
  const send = globalThis.factorySubmit;
  if (typeof send !== "function") return Promise.resolve({ ok: false, error: "not-connected" });
  return new Promise((resolve) => resolve(send(payload))).then(
    (r) => (r && r.ok === true ? { ok: true } : { ok: false, error: String(r && r.error != null ? r.error : "unknown") }),
    (e) => ({ ok: false, error: String(e) }));
}
/* una sola llamada en vuelo: un segundo toque devuelve la misma promesa y no vuelve a enviar. Enviar con flujos sin
   revisar no se bloquea: lo enviado avisa de lo que falto (spec 2026-10-21 §6). */
let sending = null;
function submitReview(){
  if(CLOSED) return Promise.resolve();
  if(sending) return sending;
  if(!takeName()) return Promise.resolve();
  const out = buildReview();
  if(!canSend(out)){ nothingToSend=true; home(true); return Promise.resolve(); }
  ST.submitError = null;
  sending = submitResponse(out).then((r)=>{
    sending = null;
    if(r.ok){ ST.submittedAt = new Date().toISOString(); save(); if(cur===null) renderSent(); }
    else { ST.submitError = r.error; save(); if(cur===null){ home(true); focusById('sendError'); } }
  });
  home(true);
  focusById('sendBox');   // el boton deshabilitado no puede tener el foco: lo tiene su bloque
  return sending;
}
/* lo enviado: llego, cuando, lo que se envio y una sola salida (NAV-02); nada que dentro del portal no sea verdad */
function renderSent(){
  if(CLOSED){ renderClosed(); return; }
  leaveFlow();
  const left = pendingIds();
  const falta = !left.length ? "" : left.length===1
    ? `Quedó 1 flujo sin revisar: «${esc(F[left[0]].tt)}». Si lo revisas, vuelve a enviar tu revisión.`
    : `Quedaron ${left.length} flujos sin revisar. Si los revisas, vuelve a enviar tu revisión.`;
  paint("sent", heading("Tu revisión llegó", `<p class="hint">Enviada ${fechaLarga(ST.submittedAt)}</p>`, "sentTitle")
    + noticesHTML(falta) + layout(`<p>Ya le llegó a ${esc(RECIPIENT)}.</p>
    <section class="sent-summary" aria-labelledby="sentList"><h2 id="sentList">Lo que enviaste</h2>
      <ul class="rows">${IDS.map(id=>`<li class="row plain-row"><span class="side-title">${esc(F[id].tt)}</span>${statusOf(flowState(id))}</li>`).join("")}</ul></section>
    <section class="flow-section" aria-labelledby="sentNext"><h2 id="sentNext">Si quieres cambiar algo</h2>
    <div class="actions"><button type="button" class="button button--secondary" onclick="home()">Cambiar algo de tu revisión</button>
      <button type="button" class="link-button" onclick="downloadReview()">Descargar una copia</button></div></section>`));
  focusById('sentTitle');   // el foco lleva la vista al resultado, sin saltar al principio
}

/* ---------- cerrada: lo enviado, solo para leer (spec 2026-10-22 cierre de piezas §3.6) ---------- */
/* lo que habia al abrir: lo que se pinta, aunque algo pida otra vista o cambie el avance en memoria */
let SENT = null;
function sentTime(s){ return typeof s==="string" ? Date.parse(s) : NaN; }
/* el dia en que se envio: la hora del portal (a menudo en UTC; fechaDia la dice en la del dispositivo), si no la de la pieza */
function closedWhen(){
  const t=[sentTime(HOST.sentAt), sentTime(ST.submittedAt)].find(x=>!Number.isNaN(x));
  return t===undefined ? "" : `<p class="hint">Enviaste tu revisión ${fechaDia(t)}</p>`;
}
/* con que viajo cada flujo (buildReview): "heredado", "ok", "revisar" o null (no se termino) */
function sentVerdict(id){
  if(heredado(id)) return "heredado";
  const st=ST.flujos[id], v=!st || st.estado==="pendiente" ? null : st.veredicto || (st.estado==="revisar" ? "revisar" : null);
  return v==="ok" || v==="revisar" ? v : null;
}
function sentStatus(id){
  const v=sentVerdict(id);
  return v==="heredado" ? statusHTML("done","Ya aprobado antes") : v==="ok" ? statusHTML("done","Aprobado")
    : v==="revisar" ? statusHTML("active","Con observaciones") : statusHTML("","Sin terminar");
}
/* DET-01 y DET-12: los datos clave de lo enviado, cuantos de cada estado, en una linea y sin etiquetas; lo ya aprobado
   antes cuenta entre los aprobados */
function sentFacts(){
  const vs=IDS.map(sentVerdict), a=vs.filter(v=>v==="heredado" || v==="ok").length, o=vs.filter(v=>v==="revisar").length;
  const datos=[`${a} ${a===1?"aprobado":"aprobados"}`, `${o} con observaciones`, `${vs.length-a-o} sin terminar`];
  return `<ul class="facts">${datos.map(t=>`<li data-rol="dato-clave">${t}</li>`).join("")}</ul>`;
}
/* la persona lee «Lo que enviaste» y el dia; el responsable lee en la franja del portal «Lo que envio <nombre> el <dia>»
   (MAR-13): la pieza no lo repite, ni el nombre ni el dia, y solo nombra lo que hay debajo */
function closedHeading(){
  return OBSERVER ? heading("Revisión", sentFacts()) : heading("Lo que enviaste", closedWhen() + sentFacts());
}
/* sus notas como texto, en el orden de los pasos y con el paso al que se refieren; el comentario general al final */
function sentNotes(id){
  const st=ST.flujos[id]; if(!st || heredado(id)) return "";
  const paso=(b)=>{ const k=Number(b), x=F[id].beats[k];   // un paso que ya no existe (datos viejos) va sin su titulo
    return !Number.isInteger(k) || k<0 ? "En el flujo" : `Paso ${k+1}${x ? " · "+stepTitle(x) : ""}`; };
  const notas=Object.entries(st.pins||{}).flatMap(([b,arr])=>arr.filter(pn=>String(pn.note||"").trim()).map(pn=>[paso(b), pn.note]));
  if((st.nota||"").trim()) notas.push(["Comentario general", st.nota]);
  return notas.length ? `<ul class="sent-notes">${notas.map(([k,t])=>`<li class="sent-note"><span class="note-kind">${k}</span><span class="note-text" data-content="person">${esc(t)}</span></li>`).join("")}</ul>` : "";
}
/* FUN-09: para leer, el estado y las notas son texto; FUN-11: los flujos en los grupos y el orden de la lista y con la
   fila de lo enviado; DET-01 y DET-03: la cabecera con sus datos clave y un grupo por seccion. Sin acciones ni indice:
   lo enviado no se cambia aqui. */
function renderClosed(){
  REVISOR=SENT.revisor; ST=normalizeState(JSON.parse(SENT.st));
  const row=(id)=>`<li class="row sent-flow"><div class="plain-row"><span class="side-title">${esc(F[id].tt)}</span>${sentStatus(id)}</div>${sentNotes(id)}</li>`;
  paint("closed", closedHeading() + layout(`<div class="flows">${activitiesHTML(row, "rows sent-flows")}</div>`));
}

/* ---------- init ---------- */
probeStorage();
adoptHostName();
if(CLOSED) SENT={revisor:REVISOR, st:JSON.stringify(ST)};
if(typeof window!=="undefined" && typeof window.addEventListener==="function"){
  window.addEventListener('resize', ()=>{ if(!cur && viewName!=="sent") ajustarIndice(); });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!cur && viewName!=="sent") ajustarIndice(); });
home();
</script>
</body>
