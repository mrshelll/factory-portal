<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge harness (no Supabase)</title>
<style>
  html, body { margin: 0; height: 100%; font: 16px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 16px; border-bottom: 1px solid #ccc; }
  main { flex: 1; min-height: 0; }
  .piece-frame { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <p>Local harness: mounts a piece HTML with the real bridge and host code, without Supabase.
  Load a file, or drive it from <code>window.harness</code>.</p>
  <label>Piece file <input type="file" id="file" accept=".html,text/html"></label>
  <label>Kind <select id="kind"><option value="questions">questions</option><option value="flow_review">flow_review</option><option value="demo_review">demo_review</option></select></label>
  <label><input type="checkbox" id="auto" checked> Answer every send with ok</label>
  <output id="last"></output>
</header>
<main id="stage"></main>
<script type="module">
import { mountPiece } from "../js/piece-frame.js";

const stage = document.getElementById("stage");
const last = document.getElementById("last");
let frame = null;

const harness = {
  events: [],
  // options: { host: { reviewerName, closed, sentAt }, submitTimeoutMs, quotaChars, autoRespond }. Without autoRespond, a send
  // waits until the test calls harness.respond(requestId, result).
  mount(html, kind, storage = {}, options = {}) {
    if (frame) frame.destroy();
    harness.events = [];
    const record = (type) => (detail) => {
      harness.events.push({ type, detail });
      last.textContent = `${type}: ${String(JSON.stringify(detail ?? null)).slice(0, 200)}`;
    };
    const onSubmit = record("submit");
    const mounted = mountPiece({
      container: stage, html, kind, storage, title: "Piece under test",
      host: options.host, submitTimeoutMs: options.submitTimeoutMs, quotaChars: options.quotaChars,
      onReady: record("ready"), onDirty: record("dirty"), onDraft: record("draft"), onSaveFailed: record("save-failed"),
      onSubmit: (message) => { onSubmit(message); if (options.autoRespond) mounted.respond(message.requestId, { ok: true }); },
      onRejected: record("rejected"), onNavigatedAway: record("navigated"), onHeight: record("height"), onScroll: record("scroll"),
    });
    frame = mounted;
    return frame;
  },
  respond(requestId, result) { frame.respond(requestId, result); },
  flush(ms) { return frame.flush(ms); },
  frameElement() { return frame && frame.iframe; },
};
window.harness = harness;

document.getElementById("file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (file) harness.mount(await file.text(), document.getElementById("kind").value, {}, { autoRespond: document.getElementById("auto").checked });
});
</script>
</body>
</html>
