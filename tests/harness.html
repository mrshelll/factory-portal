<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge harness (no Supabase)</title>
<style>
  html, body { margin: 0; height: 100%; font: 16px/1.5 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 16px; border-bottom: 1px solid #ccc; }
  main { flex: 1; min-height: 0; }
  .piece-frame { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <p>Local harness: mounts a piece HTML with the real bridge and host code, without Supabase.
  Load a file, or drive it from <code>window.harness</code>.</p>
  <label>Piece file <input type="file" id="file" accept=".html,text/html"></label>
  <label>Kind <select id="kind"><option value="questions">questions</option><option value="flow_review">flow_review</option></select></label>
  <button type="button" id="submit">Send</button>
  <output id="last"></output>
</header>
<main id="stage"></main>
<script type="module">
import { mountPiece } from "../js/piece-frame.js";

const stage = document.getElementById("stage");
const last = document.getElementById("last");
let frame = null;
let counter = 0;

const harness = {
  events: [],
  mount(html, kind, storage = {}) {
    if (frame) frame.destroy();
    harness.events = [];
    const record = (type) => (detail) => {
      harness.events.push({ type, detail });
      last.textContent = `${type}: ${JSON.stringify(detail).slice(0, 200)}`;
    };
    frame = mountPiece({
      container: stage, html, kind, storage, title: "Piece under test",
      onReady: record("ready"), onDraft: record("draft"), onSubmit: record("submit"),
      onSubmitError: record("submit-error"), onRejected: record("rejected"),
    });
    return frame;
  },
  submit() { const id = `req-${++counter}`; frame.collect(id); return id; },
  flush(ms) { return frame.flush(ms); },
  frameElement() { return frame && frame.iframe; },
};
window.harness = harness;

document.getElementById("file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (file) harness.mount(await file.text(), document.getElementById("kind").value);
});
document.getElementById("submit").addEventListener("click", () => harness.submit());
</script>
</body>
</html>
